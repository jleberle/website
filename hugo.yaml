baseURL: https://jaredeberle.org/
locale: en-us
title: Jared L. Eberle
theme: ["PaperMod"]

enableRobotsTXT: true
cleanDestinationDir: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableGitInfo: true

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      # Keep attribute quotes: NetNewsWire's home-page icon parser misses
      # unquoted <link rel=icon …> tags and falls back to the og:image
      # (card.jpg) for the RSS feed icon. Quoted attrs let it find the
      # apple-touch-icon. Costs ~400 bytes on the homepage.
      keepQuotes: true

caches:
  images:
    dir: :cacheDir/images

# Publish page-bundle resources only when a template invokes them
# (.Permalink/.RelPermalink). Without this, Hugo copies every bundle file into
# public/ — including the full-size image originals that only the fingerprinted
# copies of are ever referenced. Templates that reference bundle files by
# string path were converted to invoke the resource instead: render-link.html
# (PDFs), schema_json.html and index.jsonfeed.json (cover image).
cascade:
  - build:
      publishResources: false

params:
  env: production # enables opengraph, twitter-cards, and schema.org structured data
  title: Jared L. Eberle
  description: "Historian of late 20th Century Indigenous Activism"
  keywords: [CV, Indigenous History, Oklahoma]
  author: Jared L. Eberle
  images: ["/images/card.jpg"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true # emit <content:encoded> full article body in RSS
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: true
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  mainSections:
    - articles
    - reviews
    - quotes

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "favicon.ico"
    favicon16x16: "/icons/favicon-16x16.png"
    favicon32x32: "/icons/favicon-32x32.png"
    apple_touch_icon: "/icons/apple-touch-icon.png"

  label:
    text: "Jared L. Eberle"
    # icon: icons/apple-touch-icon.png
    # iconHeight: 35

  # home-info mode
  homeInfoParams:
    Title: "Historian of Modern Indigenous Activism"
    Content: Welcome, I'm [Jared Eberle](/about), a historian primarily focused on Indigenous activism in the late 20th century and the connections it had to global events. I'm currently a lecturer at [Oklahoma State University](https://experts.okstate.edu/jared.eberle) where my primary teaching focus is US History since 1865 and Oklahoma History.
    imageUrl: "/images/profile.avif"
    imageWidth: 120
    imageHeight: 120
    imageTitle: "Profile picture of Jared Eberle"

  socialIcons:
    - name: microblog
      title: "Micro.blog"
      url: "https://eberle.blog"
    - name: bluesky
      title: "Bluesky"
      url: "https://bsky.app/profile/jaredeberle.org"
    - name: orcid
      title: "ORCID"
      url: "https://orcid.org/0000-0002-0867-6561"

  social:
    fediverse_creator: "@jared@eberle.blog"


  footer:
    # Left column of the site footer (layouts/_partials/footer.html), rendered
    # as Markdown below your name. A short paragraph — fold in whatever you
    # like (license, humans.txt, build credits) using Markdown links. The
    # literal token {year} is replaced with the current (build) year.
    about: >-
      © 2011-{year} Jared L. Eberle. All content here is copyrighted under [creative commons](https://creativecommons.org/licenses/by-nc-sa/4.0/) and is [only human crafted](/humans.txt). Built with [Hugo](https://gohugo.io/) and [PaperMod](https://github.com/adityatelange/hugo-PaperMod/) in Oklahoma.

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  schema:
    publisherType: Person
    image: "images/profile.avif" # Person image in JSON-LD (see layouts/_partials/templates/schema_json.html)
    sameAs:
      - "https://orcid.org/0000-0002-0867-6561"
      - "https://experts.okstate.edu/jared.eberle"
      - "https://bsky.app/profile/jaredeberle.org"
      - "https://eberle.blog"

  editPost:
    URL: "https://codeberg.org/jleberle/website/src/branch/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
mediaTypes:
  application/feed+json:
    suffixes:
      - json
  application/manifest+json:
    suffixes:
      - webmanifest

outputFormats:
  jsonfeed:
    mediaType: application/feed+json
    baseName: feed
    isPlainText: true
    notAlternative: false
  manifest:
    mediaType: application/manifest+json
    baseName: site # -> /site.webmanifest
    isPlainText: true
    notAlternative: true # not a feed alternate; linked explicitly in head

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
    - jsonfeed
    - manifest # /site.webmanifest (PWA)
menu:
  main:
  - identifier: about
    name: About
    url: /about/
    weight: 10
  - identifier: cv
    name: CV
    url: /cv/
    weight: 20
  - identifier: archive
    name: Archive
    url: /archives/
    weight: 30
  - identifier: contact
    name: Contact
    url: /contact/
    weight: 40
  - identifier: search
    name: Search
    url: /search/
    weight: 50
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
markup:
  highlight:
    noClasses: true
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

taxonomies:
  category: categories
  tag: tags

# Expose static/icons to the asset pipeline too, so the header logo can resize
# the same apple-touch-icon.png that is served as the favicon (single source).
module:
  mounts:
    - source: assets
      target: assets
    - source: static/icons
      target: assets/icons

ignoreFiles:
  - .obsidian/
  - _templates/
privacy:
  youTube:
    disable: false
    privacyEnhanced: true
copyright: "[CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
