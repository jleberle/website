baseURL: https://jaredeberle.org/
languageCode: en-us
title: Jared L. Eberle
theme: ["PaperMod"]

enableRobotsTXT: false
buildDrafts: false
buildFuture: false
buildExpired: false
enableGitInfo: true

minify:
  disableXML: true
  minifyOutput: true

caches:
  images:
    dir: :cacheDir/images
    
params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Jared L. Eberle
  description: "Historian of late 20th Century Indigenous Activism"
  keywords: [CV, Indigenous History, Oklahoma]
  author: Jared L. Eberle
  images: ["/images/card.jpg"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  mainSections:
    - articles
    - reviews

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "favicon.ico"
    favicon16x16: "/icons/favicon-16x16.png"
    favicon32x32: "/icons/favicon-32x32.png"
    apple_touch_icon: "/icons/apple-touch-icon.png"
    safari_pinned_tab: "/icons/favicon-16x16.png"

  label:
    text: "Home"
    icon: icons/apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: Jared L. Eberle
    subtitle: "Historian of late 20th century Indigenous Activism"
    imageUrl: "/images/profile.avif"
    imageWidth: 120
    imageHeight: 120
    imageTitle: Profile picture of Jared Eberle
    buttons:
      - name: CV
        url: /cv/
      - name: Courses
        url: courses
      - name: Student Hours
        url: studenthours
      - name: Location
        url: location  

  # home-info mode
  homeInfoParams:
    Title: "Historian of Modern Indigenous Activism"
    Content: Welcome, I'm [Jared Eberle](/about), a historian primarily focused on Indigenous activism in the late 20th century and the connections it had to global events. I'm currently a lecturer at [Oklahoma State University](https://experts.okstate.edu/jared.eberle) where my primary teaching focus is US History since 1865 and Oklahoma History.
    imageUrl: "/images/profile.avif"
    imageWidth: 120
    imageHeight: 120
    imageTitle: "Profile picture of Jared Eberle"

  socialIcons:
    - name: microblog
      url: "https://micro.blog/jaredeberle"
    - name: bluesky
      url: "https://bsky.app/profile/jaredeberle.org"
    - name: letterboxd
      url: "https://letterboxd.com/eberle/"
    - name: librarything
      url: "https://www.librarything.com/profile/jaredeberle"
    - name: codeberg
      url: "https://codeberg.org/jleberle"
    - name: orcid
      url: "https://orcid.org/0000-0002-0867-6561"
    - name: pgpkey
      url: /key.asc

  analytics:
    google:
      SiteVerificationTag: "JcoHhnei3xZn4DBNhJlLBwk02GHgz_NoneqvSkxm7wQ"
    bing:
      SiteVerificationTag: "EE247C39ABE134768E02326A1F16CDEA"


  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://codeberg.org/jleberle/website/src/branch/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary"]
mediaTypes:
  application/feed+json:
    suffixes:
      - json

outputFormats:
  jsonfeed:
    mediaType: application/feed+json
    baseName: feed
    isPlainText: true
    notAlternative: false

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
    - jsonfeed
menu:
  main:
  - identifier: about
    name: About
    url: /about/
    weight: 10
  - identifier: archive
    name: Archive
    url: /archives/
    weight: 20
  - identifier: contact
    name: Contact
    url: /location/
    weight: 30
  - identifier: search
    name: Search
    url: /search/
    weight: 40
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
markup:
  goldmark:
    renderer:
      # Allow raw HTML in Markdown (e.g. the generated CV's <div class="hang">).
      # Safe here: this is a single-author site with no third-party content.
      unsafe: true
  highlight:
    noClasses: true
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

taxonomies:
  category: categories
  tag: tags

ignoreFiles:
  - .obsidian/
  - _templates/
privacy:
  youTube:
    disable: false
    privacyEnhanced: true
copyright: CC BY-NC-SA 4.0
