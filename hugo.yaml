# ------------------------------------------------------------
# Site identity
# ------------------------------------------------------------
baseURL: https://jaredeberle.org/
locale: en-us
timeZone: America/Chicago
title: Jared L. Eberle
copyright: "[CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

# ------------------------------------------------------------
# Build behavior
# ------------------------------------------------------------
enableRobotsTXT: true
cleanDestinationDir: true
enableGitInfo: true

buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

services:
  rss:
    limit: 20

minify:
  disableXML: true
  minifyOutput: true
  tdewolff:
    html:
      # Keep attribute quotes: NetNewsWire's home-page icon parser misses
      # unquoted <link rel=icon …> tags and falls back to og:image
      # (card.jpg) for the RSS feed icon. Quoted attrs let it find the
      # apple-touch-icon. Costs roughly 400 bytes on the homepage.
      keepQuotes: true

caches:
  images:
    dir: :cacheDir/images

# Publish page-bundle resources only when a template invokes them
# (.Permalink/.RelPermalink). This prevents Hugo from copying unreferenced
# full-size image originals into public/. Templates that reference bundle files
# must resolve them as resources rather than constructing string paths.
#
# The /series/ taxonomy's own listing pages are suppressed via
# content/series/_index.md (render: never, cascaded to its term pages) —
# nothing on the site links to them; series_nav.html only uses
# .GetTerms "series" to find sibling posts, never the term page itself.
cascade:
  - build:
      publishResources: false

# ------------------------------------------------------------
# Content model
# ------------------------------------------------------------
# `categories` is gone entirely — first as a taxonomy (its /categories/ pages
# were never linked from anywhere), then as frontmatter, since its only two
# remaining readers (the RSS <category> tag and archive-page search text) were
# already covered by `tags`. `tags` stays: every post footer links to its
# /tags/<tag>/ pages.
#
# `sources` is the bibliography. Each work is a term page under
# content/sources/<slug>/_index.md carrying its own bibliographic frontmatter
# and notes, so a source is a real URL rather than an anchor in a list. Any
# page that names a work adds `sources: ["<slug>"]`, and Hugo's reverse index
# turns that into backlinks on the source page for free — that replaces the
# cite_key matching the templates used to do by hand. There is no `cite_key`
# field at all now: the folder name IS the citation key, so a source no longer
# has to exist in Zotero to be linkable. /reading/ is the ledger, and holds the
# subset carrying a `status` — see content/sources/_index.md for why the
# taxonomy's own listing page is suppressed and what would change that.
# `tags` and `eras` are two facets, not one vocabulary. A tag names what a
# piece is ABOUT (American Indian Movement, Rodeo); an era names the period it
# concerns (1970s, 19th Century). They were one flat list until they were split,
# on the theory that "1970s" and "American Indian Movement" answer different
# questions and a subject hub built from a period term is just a date filter.
# scripts/checks/taxonomy-facet-lint.py keeps period values out of `tags`.
taxonomies:
  tag: tags
  era: eras
  series: series
  source: sources

# "Related" footer block (layouts/_partials/related_posts.html) matches on
# shared tags only - Hugo's default config also scores by keyword and date
# proximity, which would surface undated coincidences as "related" with no
# actual topical overlap. threshold: 0 means any shared tag counts; the
# template caps the result count, so this doesn't need to do that filtering.
#
# `eras` is indexed too, at a low weight: sharing a subject is a real relation,
# sharing a century is a weak one, so a subject match should always outrank it.
# Without the era index, posts whose only tag was a period would relate to
# nothing at all.
related:
  threshold: 0
  includeNewer: true
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: eras
      weight: 20

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: writing
      name: Writing
      url: /archives/
      weight: 20
    - identifier: teaching
      name: Teaching
      url: /courses/
      weight: 30
    - identifier: reading
      name: Reading
      url: /reading/
      weight: 40
    - identifier: cv
      name: CV
      url: /cv/
      weight: 50

# ------------------------------------------------------------
# Output formats
# ------------------------------------------------------------
mediaTypes:
  application/feed+json:
    suffixes:
      - json
  application/manifest+json:
    suffixes:
      - webmanifest

outputFormats:
  jsonfeed:
    mediaType: application/feed+json
    baseName: feed
    isPlainText: true
    notAlternative: false
  manifest:
    mediaType: application/manifest+json
    baseName: site # /site.webmanifest
    isPlainText: true
    notAlternative: true # linked explicitly in head, not treated as feed alternate

outputs:
  home:
    - HTML
    - RSS
    - jsonfeed
    - manifest
  section:
    - HTML
  taxonomy:
    - HTML
  term:
    - HTML

# ------------------------------------------------------------
# Markdown and syntax highlighting
# ------------------------------------------------------------
markup:
  # Use Hugo's built-in Chroma highlighter.
  # Keep noClasses true unless switching to class-based Chroma CSS.
  highlight:
    noClasses: true
  goldmark:
    parser:
      # Don't wrap a standalone image in <p>, so a trailing attribute list
      # binds to the image (block) rather than leaking as inline text. Content
      # images are styled via `.md-content img` (margins/radius on the img
      # itself), so dropping the <p> wrapper changes no rendering.
      wrapStandAloneImageWithinParagraph: false
      attribute:
        # Allow Markdown attribute lists on block elements, e.g. a standalone
        # image trailing `{loading="eager" fetchpriority="high"}`. Used to mark
        # a post's leading hero image as the LCP so render-image.html serves it
        # eagerly instead of lazily (the cover figure is hidden in single view
        # on those posts). title stays at its default (true).
        block: true

# ------------------------------------------------------------
# Image processing (applies only to Hugo-resized output — the responsive
# srcset candidates and the profile/schema resizes; source files served
# as-is, e.g. the cover.jpg OG companions, are unaffected).
#
# Set explicitly for reproducibility (so a Hugo upgrade can't shift it
# silently). 50 is a deliberate choice for AVIF: measured across all resized
# candidates it cuts total weight ~30% vs Hugo's implicit AVIF default
# (~q57-equivalent), and was eyeballed at the actual display sizes on the
# hardest cases — a book cover with fine subtitle text and a detailed rodeo
# photo — with no visible loss or gradient banding. Note Hugo's AVIF quality
# is monotonic but NOT a JPEG-style scale: q65/q75 produce *larger* files
# than the default, so don't "raise" this expecting smaller output.
# ------------------------------------------------------------
imaging:
  quality: 50

# ------------------------------------------------------------
# Module mounts
# ------------------------------------------------------------
module:
  mounts:
    - source: assets
      target: assets
    # Expose static/icons to the asset pipeline so the header logo and favicon
    # can share the same source image.
    - source: static/icons
      target: assets/icons

# ------------------------------------------------------------
# Privacy
# ------------------------------------------------------------
privacy:
  youTube:
    disable: false
    privacyEnhanced: true

# ------------------------------------------------------------
# Site parameters
# ------------------------------------------------------------
params:
  # Site metadata used by head templates, feeds, schema, and manifest output.
  title: Jared L. Eberle
  description: "Historian of late 20th Century Indigenous Activism"
  keywords: [CV, Indigenous History, Oklahoma]
  author: Jared L. Eberle
  email: jared@jaredeberle.org
  images: ["/images/card.jpg"]
  dateFormat: "January 2, 2006"

  # Primary sections included in archives, RSS/JSON feeds, and prev/next links.
  contentSections:
    - articles
    - reviews
    - quotes

  # Site display behavior.
  hideMeta: false
  hideSummary: false

  showReadingTime: true
  showBreadcrumbs: true
  showWordCount: true
  showRssLink: true
  rssFullContent: true # emit <content:encoded> full article body in RSS
  websubHub: "https://pubsubhubbub.appspot.com/"
  assets:
    favicon: "favicon.ico"
    favicon16x16: "/icons/favicon-16x16.png"
    favicon32x32: "/icons/favicon-32x32.png"
    faviconSvg: "/icons/favicon.svg"
    apple_touch_icon: "/icons/apple-touch-icon.png"
    background_color: "#efefed"
    theme_color: "#efefed"
    theme_color_dark: "#1b2124"
    msapplication_TileColor: "#1b2124"

  brand:
    text: "Jared L. Eberle"

  homeIntro:
    title: "Historian of Modern Indigenous Activism"
    content: Welcome, I'm [Jared Eberle](/about), a historian primarily focused on Indigenous activism in the late 20th century and the connections it had to global events. I'm currently a lecturer at [Oklahoma State University](https://experts.okstate.edu/jared.eberle) where my primary teaching focus is US History since 1865 and Oklahoma History.
    imageUrl: "/images/profile-2026.avif"
    imageWidth: 148
    imageHeight: 148
    imageTitle: "Profile picture of Jared Eberle"

  socialLinks:
    - name: microblog
      title: "Micro.blog"
      url: "https://eberle.blog"
    - name: bluesky
      title: "Bluesky"
      url: "https://bsky.app/profile/jaredeberle.org"
    - name: orcid
      title: "ORCID"
      url: "https://orcid.org/0000-0002-0867-6561"

  social:
    fediverse_creator: "@jared@eberle.blog"

  footer:
    # Rendered as Markdown in layouts/_partials/site_footer.html.
    # The literal {year} token is replaced with the current build year.
    about: |-
      [© 2011-{year}](https://creativecommons.org/licenses/by-nc-sa/4.0/) · [Colophon](/colophon)

      [Human crafted](/humans.txt) · [Privacy First](/privacy)

  cover:
    # hiddenInList/hiddenInSingle both fall back to this (cover.html,
    # list.html, single.html), so setting it alone hides covers everywhere
    # while keeping them available to structured data (schema_json.html).
    hidden: true

  schema:
    publisherType: Person
    image: "images/profile-2026.avif" # Person image in JSON-LD
    sameAs:
      - "https://orcid.org/0000-0002-0867-6561"
      - "https://experts.okstate.edu/jared.eberle"
      - "https://bsky.app/profile/jaredeberle.org"
      - "https://eberle.blog"

  suggestChanges:
    url: "https://github.com/jleberle/website/edit/main/content"
    text: "Suggest Changes"
    appendFilePath: true
