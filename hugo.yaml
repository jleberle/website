baseURL: https://jaredeberle.org/
locale: en-us
title: Jared L. Eberle
theme: ["PaperMod"]

enableRobotsTXT: false
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

caches:
  images:
    dir: :cacheDir/images
    
params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Jared L. Eberle
  description: "Historian of late 20th Century Indigenous Activism"
  keywords: [CV, Indigenous History, Oklahoma]
  author: Me
  # author: ["Me", "You"] # multiple authors
  images: ["/images/card.webp"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  enableGitInfo: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  mainSections:
    - articles
    - reviews

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "favicon.ico"
    favicon16x16: "/icons/favicon-16x16.png"
    favicon32x32: "/icons/favicon-32x32.png"
    apple_touch_icon: "/icons/apple-touch-icon.png"
    safari_pinned_tab: "/icons/favicon-16x16.png"

  label:
    text: "Home"
    icon: /icons/apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Jared L. Eberle
    subtitle: "Historian of late 20th century Indigenous Activism"
    imageUrl: "/images/profile.webp"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: CV
        url: cv.pdf
      - name: Courses
        url: courses
      - name: Student Hours
        url: studenthours
      - name: Location
        url: location  

  # home-info mode
  homeInfoParams:
    Title: "Welcome \U0001F44B"
    Content: I'm a historian of modern Indigenous activism and a lectuer at Oklahoma State University.

  socialIcons:
    - name: orcid
      url: "https://orcid.org/0000-0002-0867-6561" 
    - name: pgpkey
      url: /key.asc
    - name: bluesky
      url: "https://bsky.app/profile/jaredeberle.org"
    - name: letterboxd
      url: "https://letterboxd.com/eberle/" 
    - name: other 
      url: "https://codeberg.org/jleberle"

  analytics:
    google:
      SiteVerificationTag: "JcoHhnei3xZn4DBNhJlLBwk02GHgz_NoneqvSkxm7wQ"
    bing:
      SiteVerificationTag: "EE247C39ABE134768E02326A1F16CDEA"


  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://codeberg.org/jleberle/website/src/branch/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary"]
outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
menu:
   main:
   - identifier: Micro.blog
     name: Updates
     url: https://updates.jaredeberle.org/
     weight: 10
   - identifier: OSU
     name: OSU Directory
     url: https://experts.okstate.edu/jared.eberle
     weight: 20
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

ignoreFiles:
  - .obsidian/
privacy:
  youTube:
    disable: false
    privacyEnhanced: true