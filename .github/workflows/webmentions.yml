name: Fetch webmentions

# Pulls received webmentions from webmention.io on its own schedule, decoupled
# from publishing — a post's mentions can arrive years after it goes up. If
# anything changed, the commit here is pushed like any other; Cloudflare
# Workers Builds deploys on every push regardless of source, so no separate
# deploy hook is needed (see docs/operations.md).
on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webmentions
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch and commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch webmentions
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        run: python3 scripts/fetch-webmentions.py --token "$WEBMENTION_IO_TOKEN"

      - name: Commit and push if changed
        # Pushes with PUSH_TOKEN (a PAT owned by an admin) rather than the
        # default GITHUB_TOKEN: main requires 2 status checks, and the bot
        # identity behind GITHUB_TOKEN isn't exempt from that the way an
        # admin push is (enforce_admins is off) — GH006 otherwise.
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- data/webmentions.json)" ]]; then
            echo "No new webmentions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/webmentions.json
          git commit -m "Update webmentions"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git push
