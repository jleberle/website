name: Site checks

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.163.3"
  LYCHEE_IMAGE: "lycheeverse/lychee:0.24.2"

jobs:
  verify:
    name: Build, validate, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Hugo
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
            -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Add lychee wrapper for preflight
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/lychee" <<'SH'
          #!/usr/bin/env sh
          exec docker run --rm -v "$PWD":/work -w /work lycheeverse/lychee:0.24.2 "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/lychee"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run full preflight
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'scripts/preflight.sh --strict --full 2>&1 | tee .ci-artifacts/preflight.log'

      - name: Run axe accessibility checks
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'npm run test:axe 2>&1 | tee .ci-artifacts/axe.log'

      - name: Run external link check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'docker run --rm -v "$PWD":/work -w /work "$LYCHEE_IMAGE" --no-progress --config lychee.toml public/ 2>&1 | tee .ci-artifacts/external-links.log'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-checks-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            .ci-artifacts/
            public/
