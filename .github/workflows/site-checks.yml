name: Site checks

# Scoped to main and PRs: an unqualified `on: push` ran the full matrix — a
# full-history clone for the secret scan, plus Hugo, ImageMagick and a
# Playwright Chromium for the build — on every push to every branch.
# paths-ignore covers only files nothing is built from; note `README.md`
# anchors to the repo root, so assets/css/README.md still triggers a run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  LYCHEE_IMAGE: "lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # No GITHUB_TOKEN: gitleaks-action's own docs say it exists solely
          # to call the GitHub API for PR comments, which is disabled below.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # Pinned past 8.24.3: that version silently ignores the top-level
          # [[allowlists]] entry in .gitleaks.toml when a rule is also
          # extended from the default config, so the cite_key allowlist
          # never suppressed the generic-api-key false positive it targets.
          # Verified fixed as of 8.30.1.
          GITLEAKS_VERSION: "8.30.1"

  verify:
    name: Build, validate, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only the two webmention steps at the end need to push (a data-file
    # commit recording which outbound links have already been notified);
    # everything else here — installing deps, running Playwright, shelling
    # out to lychee's Docker image — has no business holding a write token.
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm

      - name: Derive Hugo version from statichost.yml
        # statichost.yml is the actual production build config (StaticHost.eu
        # reads it directly), so it's the single source of truth for which
        # Hugo release to install here. notify-websub.py later does a
        # byte-for-byte comparison between this job's build output and what's
        # live on the site — if this job's Hugo version ever drifted from
        # StaticHost's, that comparison would never match and the notify step
        # would burn its full --wait budget every run before failing.
        run: |
          set -euo pipefail
          IMAGE_LINE=$(grep -m1 '^image:' statichost.yml)
          VERSION=$(sed -n -E 's/^image: hugomods\/hugo:debian-git-([0-9]+\.[0-9]+\.[0-9]+)@sha256:.*/\1/p' <<< "$IMAGE_LINE")
          if [[ -z "$VERSION" ]]; then
            echo "Could not parse a Hugo version out of statichost.yml's image line: $IMAGE_LINE" >&2
            exit 1
          fi
          echo "Using Hugo $VERSION (parsed from statichost.yml)"
          echo "HUGO_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Hugo
        run: |
          set -euo pipefail
          DEB="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${DEB}" \
            -o "/tmp/${DEB}"
          curl -fsSL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" \
            -o /tmp/hugo_checksums.txt
          # Verify the downloaded .deb against Hugo's published release checksum
          # before installing as root — HTTPS only guarantees transport
          # integrity, not that the artifact matches what was actually built.
          awk -v f="$DEB" '$2 == f' /tmp/hugo_checksums.txt > /tmp/hugo.deb.sha256
          [[ -s /tmp/hugo.deb.sha256 ]] || { echo "No checksum entry for $DEB" >&2; exit 1; }
          (cd /tmp && sha256sum -c hugo.deb.sha256)
          sudo dpkg -i "/tmp/${DEB}"
          hugo version

      - name: Install ImageMagick
        # scripts/checks/image-metadata-lint.py (run by preflight) shells out
        # to `identify`. Only needed in CI — to-avif.sh is a local-only
        # authoring tool, so this was never a CI dependency before that check
        # was added.
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Add lychee wrapper for preflight
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/lychee" <<SH
          #!/usr/bin/env sh
          exec docker run --rm -v "\$PWD":/work -w /work $LYCHEE_IMAGE "\$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/lychee"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run full preflight
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'scripts/preflight.sh --strict --full 2>&1 | tee .ci-artifacts/preflight.log'

      - name: Run axe accessibility checks
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'npm run test:axe 2>&1 | tee .ci-artifacts/axe.log'

      - name: Notify feed services after deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: python3 scripts/notify-websub.py --wait 300 public/index.xml public/reading/index.xml public/feed.json

      - name: Send outbound webmentions
        # Runs after the WebSub step above has confirmed the live site
        # matches this build, so a receiver that fetches the source URL to
        # verify the link finds it there. State-cached (see
        # scripts/send-webmentions.py), so only links introduced or edited
        # since the last successful run are attempted.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          python3 scripts/send-webmentions.py public/articles public/reviews public/quotes \
            --public-root public --base-url https://jaredeberle.org

      - name: Commit outbound webmention state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- data/webmentions-sent.json)" ]]; then
            echo "No new outbound webmention attempts to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/webmentions-sent.json
          git commit -m "Record outbound webmention attempts"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git push

      - name: Run external link check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'docker run --rm -v "$PWD":/work -w /work "$LYCHEE_IMAGE" --no-progress --config lychee.toml public/ 2>&1 | tee .ci-artifacts/external-links.log'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-checks-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: .ci-artifacts/
