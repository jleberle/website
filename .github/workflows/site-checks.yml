name: Site checks

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.163.3"
  LYCHEE_IMAGE: "lycheeverse/lychee:0.24.2"

jobs:
  verify:
    name: Build, validate, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Hugo
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
            -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Add lychee wrapper for preflight
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/lychee" <<'SH'
          #!/usr/bin/env sh
          exec docker run --rm -v "$PWD":/work -w /work lycheeverse/lychee:0.24.2 "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/lychee"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run full preflight
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'scripts/preflight.sh --strict 2>&1 | tee .ci-artifacts/preflight.log'

      - name: Run axe accessibility checks
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'npm run test:axe 2>&1 | tee .ci-artifacts/axe.log'

      - name: Run external link check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'docker run --rm -v "$PWD":/work -w /work "$LYCHEE_IMAGE" --no-progress --config lychee.toml public/ 2>&1 | tee .ci-artifacts/external-links.log'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-checks-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            .ci-artifacts/
            public/

      - name: Open or update scheduled failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_WORKFLOW: ${{ github.workflow }}
          GH_JOB: verify
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          run_id = os.environ["GH_RUN_ID"]
          server_url = os.environ["GH_SERVER_URL"]
          workflow = os.environ["GH_WORKFLOW"]
          job = os.environ["GH_JOB"]

          owner, name = repo.split("/", 1)
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}"
          title = f"Scheduled CI failure: {workflow}"
          body = (
              "The scheduled site check failed.\n\n"
              f"- Workflow: `{workflow}`\n"
              f"- Job: `{job}`\n"
              f"- Run: {run_url}\n"
              f"- Trigger: `schedule`\n\n"
              "Failure artifacts should be attached to the workflow run."
          )
          comment = (
              "Another scheduled failure was detected.\n\n"
              f"- Run: {run_url}\n"
              "Failure artifacts should be attached to the workflow run."
          )

          def request(url, method="GET", data=None):
              req = urllib.request.Request(url, method=method)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if data is not None:
                  payload = json.dumps(data).encode("utf-8")
                  req.add_header("Content-Type", "application/json")
              else:
                  payload = None
              with urllib.request.urlopen(req, payload) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          query = urllib.parse.quote(f'repo:{repo} is:issue is:open in:title "{title}"')
          search = request(f"https://api.github.com/search/issues?q={query}")
          items = search.get("items", [])

          if items:
              issue_number = items[0]["number"]
              request(
                  f"https://api.github.com/repos/{owner}/{name}/issues/{issue_number}/comments",
                  method="POST",
                  data={"body": comment},
              )
              print(f"Updated existing issue #{issue_number}")
          else:
              created = request(
                  f"https://api.github.com/repos/{owner}/{name}/issues",
                  method="POST",
                  data={"title": title, "body": body},
              )
              print(f"Created issue #{created['number']}")
          PY
