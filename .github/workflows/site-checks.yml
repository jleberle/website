name: Site checks

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.163.3"
  LYCHEE_IMAGE: "lycheeverse/lychee:0.24.2"

jobs:
  verify:
    name: Build, validate, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Hugo
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
            -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Add lychee wrapper for preflight
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/lychee" <<'SH'
          #!/usr/bin/env sh
          exec docker run --rm -v "$PWD":/work -w /work lycheeverse/lychee:0.24.2 "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/lychee"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run full preflight
        run: scripts/preflight.sh --strict

      - name: Run axe accessibility checks
        run: npm run test:axe

      - name: Run external link check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: docker run --rm -v "$PWD":/work -w /work "$LYCHEE_IMAGE" --no-progress --config lychee.toml public/
