name: Site checks

# Scoped to main and PRs: an unqualified `on: push` ran the full matrix — a
# full-history clone for the secret scan, plus Hugo, ImageMagick and a
# Playwright Chromium for the build — on every push to every branch.
# paths-ignore covers only files nothing is built from; note `README.md`
# anchors to the repo root, so assets/css/README.md still triggers a run.
#
# paths-ignore is deliberately on `push` ONLY. Both jobs below are required
# status checks on main, and a required check that never reports leaves a PR
# stuck pending forever with no failure to fix — which is exactly what a
# docs-only PR would hit if the filter applied here. Skipping costs a few
# minutes of Actions time on the rare docs-only PR; the alternative is an
# un-mergeable PR and no way to tell that from a hung one.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  LYCHEE_IMAGE: "lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        # Direct binary install instead of gitleaks/gitleaks-action: this job
        # already clones full history and runs a full scan, and the PR-comment
        # / artifact-upload features gitleaks-action adds were disabled anyway
        # (see git history), so the action bought nothing but a Docker pull
        # and a GITHUB_TOKEN requirement.
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        # Pinned past 8.24.3: that version silently ignores the top-level
        # [[allowlists]] entry in .gitleaks.toml when a rule is also
        # extended from the default config, so the cite_key allowlist
        # never suppressed the generic-api-key false positive it targets.
        # Verified fixed as of 8.30.1.
        run: gitleaks git --no-banner

  verify:
    name: Build, validate, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only the two webmention steps at the end need to push (a data-file
    # commit recording which outbound links have already been notified);
    # everything else here — installing deps, running Playwright, shelling
    # out to lychee's Docker image — has no business holding a write token.
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Derive Hugo version from .hugo-version
        # .hugo-version is this repo's record of the Hugo release Cloudflare
        # Workers Builds is pinned to via its own HUGO_VERSION build variable
        # (dashboard-managed — see docs/operations.md). notify-websub.py later
        # does a byte-for-byte comparison between this job's build output and
        # what's live on the site — if this job's Hugo version ever drifted
        # from Cloudflare's, that comparison would never match and the notify
        # step would burn its full --wait budget every run before failing.
        run: |
          set -euo pipefail
          VERSION=$(cat .hugo-version)
          if [[ -z "$VERSION" ]]; then
            echo "Could not read a Hugo version from .hugo-version" >&2
            exit 1
          fi
          echo "Using Hugo $VERSION (from .hugo-version)"
          echo "HUGO_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Hugo
        run: |
          set -euo pipefail
          DEB="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${DEB}" \
            -o "/tmp/${DEB}"
          curl -fsSL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" \
            -o /tmp/hugo_checksums.txt
          # Verify the downloaded .deb against Hugo's published release checksum
          # before installing as root — HTTPS only guarantees transport
          # integrity, not that the artifact matches what was actually built.
          awk -v f="$DEB" '$2 == f' /tmp/hugo_checksums.txt > /tmp/hugo.deb.sha256
          [[ -s /tmp/hugo.deb.sha256 ]] || { echo "No checksum entry for $DEB" >&2; exit 1; }
          (cd /tmp && sha256sum -c hugo.deb.sha256)
          sudo dpkg -i "/tmp/${DEB}"
          hugo version

      - name: Install ImageMagick
        # scripts/checks/image-metadata-lint.py (run by preflight) shells out
        # to `identify`. Only needed in CI — to-avif.sh is a local-only
        # authoring tool, so this was never a CI dependency before that check
        # was added.
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Add lychee wrapper for preflight
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/lychee" <<SH
          #!/usr/bin/env sh
          exec docker run --rm -v "\$PWD":/work -w /work $LYCHEE_IMAGE "\$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/lychee"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run full preflight
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'scripts/preflight.sh --strict --full 2>&1 | tee .ci-artifacts/preflight.log'

      - name: Verify security.txt signature and expiry
        # Deliberately NOT in scripts/preflight.sh. Nothing in a commit can
        # invalidate this signature — only the calendar can — so gating a push
        # on it stops the wrong person at the wrong moment: a writer without
        # the private key can neither fix it nor publish around it.
        #
        # Every run verifies the clearsignature against the published key
        # (static/key.asc; no private key needed). The weekly schedule adds
        # --days 60, so the "re-sign this" failure arrives with two months of
        # lead time instead of on the morning it expires. Bump the Expires
        # field and re-run scripts/sign-security-txt.sh to clear it.
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            scripts/sign-security-txt.sh --check --days 60
          else
            scripts/sign-security-txt.sh --check
          fi

      - name: Run axe accessibility checks
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'npm run test:axe 2>&1 | tee .ci-artifacts/axe.log'

      - name: Notify feed services after deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: python3 scripts/notify-websub.py --wait 300 public/index.xml public/reading/index.xml public/feed.json

      - name: Send outbound webmentions
        # Runs after the WebSub step above has confirmed the live site
        # matches this build, so a receiver that fetches the source URL to
        # verify the link finds it there. State-cached (see
        # scripts/send-webmentions.py), so only links introduced or edited
        # since the last successful run are attempted.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          python3 scripts/send-webmentions.py public/articles public/reviews public/quotes \
            --public-root public --base-url https://jaredeberle.org

      - name: Commit outbound webmention state
        # Pushes with PUSH_TOKEN (a PAT owned by an admin), not GITHUB_TOKEN:
        # main requires 2 status checks and the bot identity behind
        # GITHUB_TOKEN isn't exempt from that the way an admin push is
        # (enforce_admins is off) — GH006 otherwise, silently swallowed here
        # by continue-on-error.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- data/webmentions-sent.json)" ]]; then
            echo "No new outbound webmention attempts to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/webmentions-sent.json
          git commit -m "Record outbound webmention attempts"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git push

      - name: Run external link check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .ci-artifacts
          bash -o pipefail -c 'docker run --rm -v "$PWD":/work -w /work "$LYCHEE_IMAGE" --no-progress --config lychee.toml public/ 2>&1 | tee .ci-artifacts/external-links.log'

      - name: Rewrite dead links to Wayback snapshots
        # Runs its own liveness check independently of the lychee step above
        # (that's how scripts/archive-links.sh works standalone) rather than
        # consuming its log — the point is closing the loop on the SAME
        # schedule as the check above, not reusing its output.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: scripts/archive-links.sh --all

      - name: Commit archived link rewrites
        # See the PUSH_TOKEN note on "Commit outbound webmention state" above.
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- content/)" ]]; then
            echo "No dead links rewritten to archive snapshots."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "Rewrite dead citation links to Wayback Machine snapshots"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git push

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-checks-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: true
          path: .ci-artifacts/
