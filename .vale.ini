# Project Vale config — overrides the global ~/.vale.ini (Vale + proselint
# only) for files in this repo. Readability is enabled here because this is
# public-facing prose: grade-level feedback is wrong for scholarship but
# right for blog posts and course pages.
#
# One-time setup on a new machine: vale sync  (downloads into .vale/styles,
# which is gitignored)

StylesPath = .vale/styles

MinAlertLevel = suggestion

Packages = proselint, Readability

[*.md]
BasedOnStyles = Vale, proselint, Readability

# Spelling is owned by vim's built-in spell; grammar by harper_ls.
Vale.Spelling = NO
