<link type="text/plain" rel="author" href="{{ "humans.txt" | absURL }}">
{{- $js := slice }}
{{- range slice "js/embeds.js" "js/carousel.js" "js/lightbox.js" "js/obf-email.js" }}
{{- with resources.Get . }}{{ $js = $js | append . }}{{ end }}
{{- end }}
{{- with $js }}

<script defer src="{{ $bundle.RelPermalink }}"></script>
{{- end }}
