when:
  - event: push
  - event: cron
  - event: manual

steps:
  - name: build
    image: hugomods/hugo:exts-0.154.5
    commands:
      - hugo --minify

  - name: link-check
    image: lycheeverse/lychee:latest
    when:
      - event: cron
      - event: manual
    commands:
      - lychee --no-progress --config lychee.toml public/
